version: v1.0
name: Upload Dummy File to PixelDrain

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204

blocks:
  - name: Create and Upload Dummy File
    task:
      env_vars:
        - name: PIXELDRAIN_API_KEY
          secret: Pixeldrain Api 
      jobs:
        - name: Upload to PixelDrain
          commands:
            - echo "Creating dummy file..."
            - echo "This is a dummy file created by Semaphore CI." > dummy.txt
            - echo "Uploading to PixelDrain..."
            - curl -X POST https://pixeldrain.com/api/file \
                -H "Authorization: $PIXELDRAIN_API_KEY" \
                -F "file=@dummy.txt"
