version: v1.0

name: Upload to PixelDrain

agent:
  machine:
    type: e1-standard-2        # ✅ Entry-level machine
    os_image: ubuntu2004       # ✅ Compatible OS image

blocks:
  - name: Upload
    task:
      env_vars:
        - name: PIXELDRAIN_API_KEY
          value: 5f45f184-64bb-4eaa-be19-4a5f0459db49  # Replace with your actual key
      jobs:
        - name: Upload dummy.txt
          commands:
            - echo "This is a dummy file." > dummy.txt
            - echo "Uploading to PixelDrain..."
            - |
              response=$(curl -s -T dummy.txt \
                -u :8ec6f000-e8d1-403d-820b-4324a6a68869 \
                https://pixeldrain.com/api/file/)
              id=$(echo "$response" | grep -o '"id":"[^"]*"' | cut -d':' -f2 | tr -d '"')
              echo "✅ File uploaded: https://pixeldrain.com/u/$id"
