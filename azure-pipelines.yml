version: 1.0

image: Ubuntu2204

mode: Script

environment:
  BIN_NAME: my-new-bin
  MAGNET_LINK: "your-magnet-link-here"

build_script:
  - bash: |
      echo "Starting build on Ubuntu..."
      
      # Update packages
      sudo apt-get update
      
      # Install necessary build tools (example: git, gcc, make)
      sudo apt-get install -y git build-essential curl
      
      # Clone your repository or copy your source files
      # git clone https://github.com/your/repo.git
      # cd repo
      
      # Run your custom build commands here
      # For example, compile C code:
      # gcc -o myapp main.c
      
      # Or run a build script if available
      # ./build.sh
      
      echo "Build completed."

after_build:
  - bash: |
      echo "Downloading torrent and uploading files..."
      
      # Install Node.js and webtorrent-cli
      curl -fsSL https://deb.nodesource.com/setup_current.x | sudo -E bash -
      sudo apt-get install -y nodejs
      npm install -g webtorrent-cli
      
      # Download the torrent via magnet link
      webtorrent download "$MAGNET_LINK" --out ~/downloaded_files
      
      # Upload files to filebin
      mkdir -p ~/uploaded_files
      find ~/downloaded_files -type f -print0 | while IFS= read -r -d '' file; do
        filename=$(basename "$file")
        echo "Uploading $filename..."
        curl -X POST --data-binary @"$file" "https://filebin.net/$BIN_NAME/$filename"
      done
