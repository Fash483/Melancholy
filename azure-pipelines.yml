version: 1.0

image: Ubuntu:20.04

mode: Script  # Disables MSBuild, runs in script mode

environment:
  BIN_NAME: fn5l2fc0lh3bplas

build_script:
  - cmd: |
      # Update packages
      sudo apt-get update
      # Install Node.js, npm, curl
      sudo apt-get install -y curl nodejs npm
      # Install webtorrent-cli
      npm install -g webtorrent-cli
      # Download torrent (replace with your magnet link)
      webtorrent download "magnet:?xt=urn:btih:d8ada5a2ffd9f550c50a4b0c00e61260b1da0f97&dn=Kiff%20S02E26%20The%20Macaroni%20Affair%201080p%20HULU%20WEB-DL%20DDP5%201%20H%20264-NTb%5BEZTVx.to%5D.mkv%5Beztv%5D&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&tr=udp%3A%2F%2Fp4p.arenabg.com%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.torrent.eu.org%3A451%2Fannounce&tr=udp%3A%2F%2Fopen.stealth.si%3A80%2Fannounce" --out ~/downloaded_files
      # Create directory for uploads
      mkdir -p ~/uploaded_files
      # Upload files to Filebin
      find ~/downloaded_files -type f -print0 | while IFS= read -r -d '' file; do
        filename=$(basename "$file")
        echo "Uploading $filename..."
        curl -X POST --data-binary @"$file" "https://filebin.net/$BIN_NAME/$filename"
      done
